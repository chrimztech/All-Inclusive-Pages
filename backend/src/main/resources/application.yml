spring:
  application:
    name: eoz-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eoz_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:11111111}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  data:
    web:
      pageable:
        # Bounds bulk reads through list endpoints (the sitemap uses 200 per page).
        max-page-size: 200
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8081}
  # Behind Nginx/a load balancer set to "native" so client IPs (audit, rate limits) come from X-Forwarded-For.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: always

eoz:
  rate-limit:
    # Requests per minute per client IP to sign-in/sign-up/reset/two-step endpoints, and to public forms.
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
    forms-per-minute: ${RATE_LIMIT_FORMS_PER_MINUTE:10}
  backup:
    dir: ${BACKUP_DIR:./data/backups}
    # Successful backups to keep; older ones are deleted after each nightly backup (0 keeps everything).
    keep: ${BACKUP_KEEP:14}
  payments:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev-only-webhook-secret-change-me}
  password:
    # "local": refuse passwords on the bundled common-password list. "hibp": also check Have I Been Pwned
    # (only the first 5 characters of the password's SHA-1 hash are sent).
    breach-check: ${BREACHED_PASSWORD_CHECK:local}
  demo:
    # Password for the demo accounts created by the "demo" profile (SPRING_PROFILES_ACTIVE=demo).
    password: ${DEMO_PASSWORD:Kafue-Demo-2026!}
  # Key for encrypting stored secrets (two-step verification keys). Any long random string; keep it stable.
  data-key: ${EOZ_DATA_KEY:}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-eoz-platform-secret-key-please-rotate-in-prod}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:14}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084,http://localhost:8085,http://localhost:8086,http://localhost:8087,http://localhost:8088,http://localhost:8089,http://localhost:8090}
  # Public addresses used in emails (unsubscribe links). Set to the real domains in production.
  public-web-url: ${PUBLIC_WEB_URL:http://localhost:8082}
  public-api-url: ${PUBLIC_API_URL:http://localhost:8081/api/v1}
  org:
    name: "Echo Opportunities Zambia"
    short-name: "EOZ"
    phone: "0771 538 765"
    email: "echoopportunitieszambia@gmail.com"

management:
  health:
    # Email goes through a retrying outbox, so an SMTP outage must not mark the API unhealthy
    # (failed deliveries are visible under Admin > Notifications instead).
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness and /actuator/health/readiness for container orchestrators.
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/v1/openapi
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    path: /api/v1/docs
    enabled: ${API_DOCS_ENABLED:true}
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  pattern:
    # Every line carries the request's correlation id (X-Request-Id).
    level: "%5p [%X{requestId:-}]"
  level:
    root: INFO
    zm.eoz.platform: ${APP_LOG_LEVEL:INFO}
